# asr_parakeet template — consumed by pipeline/main.py batch mode.
#
# Placeholders ({name}, {language}, {shar_dir}, {output_root}) are
# substituted per-dataset by the orchestrator's _render_template. Leave
# them as-is here; only override per-template knobs (loader, model, vad)
# if you want a different default for the batch.
#
# Layout: Parakeet writes to <output_root>/<name>/asr_plain_output/parakeet/.

shar_dir:           "{shar_dir}"
output_dir:         "{output_root}/{name}"
target_sample_rate: 16000

loader:
  max_batch_duration: 1200.0
  num_buckets:        20
  bucket_buffer_size: 30000
  decode_num_workers: 16
  prefetch_factor:    4
  sampler_shuffle:    true
  sampler_seed:       42
  dataloader_timeout: 300

parakeet:
  model:                   "nvidia/parakeet-tdt-0.6b-v3"
  nemo_micro_batch_size:   512
  dtype:                   "bfloat16"
  compute_word_timestamps: false

vad:
  enabled:        true
  model:          "nvidia/frame_vad_multilingual_marblenet_v2.0"
  threshold:      0.5
  min_speech_ms:  250
  min_silence_ms: 250
  skip_if_below:  null

runner:
  heartbeat_seconds:  5.0
  flush_every:        100
  writer_queue_size:  1024
