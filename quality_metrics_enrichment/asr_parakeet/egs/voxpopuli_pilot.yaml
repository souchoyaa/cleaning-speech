# asr_parakeet — VoxPopuli pilot, multilang (de + mt).
#
# de = all-3 group, mt = subset group; parakeet runs for BOTH (it covers
# all 23 VoxPopuli langs). One SLURM job iterates the languages, reusing
# the single multilingual parakeet-tdt-0.6b-v3 model across both.
#
# Per-lang output: <output_dir>/<lang>/quality_asr/parakeet/parakeet_rank_*.jsonl

# ===== multi-language driver =====
language_split_dir:        "/capstor/scratch/cscs/sgodey/dedup_pipeline_test/voxpopuli_pilot"
languages:                 ["de", "mt"]
language_subdir_template:  "{lang}"

# ===== common =====
output_dir:         "/capstor/scratch/cscs/sgodey/dedup_pipeline_test/voxpopuli_pilot_out"
target_sample_rate: 16000

# ===== loader / dynamic bucketing =====
loader:
  max_batch_duration: 1200.0
  num_buckets:        20
  bucket_buffer_size: 30000
  decode_num_workers: 16
  prefetch_factor:    4
  sampler_shuffle:    true
  sampler_seed:       42
  dataloader_timeout: 300

# ===== parakeet (multilingual TDT — single model across all languages) =====
parakeet:
  model:                   "nvidia/parakeet-tdt-0.6b-v3"
  nemo_micro_batch_size:   512
  dtype:                   "bfloat16"
  compute_word_timestamps: false   # canary supplies ROVER word timestamps

# ===== vad (Frame-VAD MarbleNet v2.0) =====
vad:
  enabled:        true
  model:          "nvidia/frame_vad_multilingual_marblenet_v2.0"
  threshold:      0.5
  min_speech_ms:  250
  min_silence_ms: 250
  skip_if_below:  null

# ===== runner =====
runner:
  heartbeat_seconds:  5.0
  flush_every:        100
  writer_queue_size:  1024
