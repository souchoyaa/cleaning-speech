# Minimal asr_vllm test config — CV-zh-CN validation split.
shar_dir:   "/capstor/scratch/cscs/sgodey/audio-datasets/SHAR/stage_2/commonvoice22_sidon/zh/validation"
output_dir: "/capstor/scratch/cscs/sgodey/data_selection_runs/quality/Result/quality_metrics/test_cv_zh_validation"

loader:
  num_workers:   16
  queue_size:    512
  min_duration:  0.5
  max_duration:  600

vllm_launcher:
  script: "vllm_qwen3_asr_launcher.sh"
  port:   8080

vllm_feeder:
  backend:    "voxtral"
  slot_name:  "qwen"
  api_base:   ""                                   # filled by env
  api_key:    "EMPTY"
  api_model:  "Qwen/Qwen3-ASR-1.7B-${USER}"
  api_temperature: 0.0
  api_concurrency_per_replica: 64
  api_timeout: 240
  api_max_retries: 4
  log_every:         500
  work_queue_size:   1024
  flush_every:       500
  heartbeat_seconds: 5
  circuit_break_threshold: 50
