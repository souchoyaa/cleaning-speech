# asr_vllm template — consumed by pipeline/main.py batch mode.
#
# Placeholders {name}, {language}, {shar_dir}, {output_root} are
# substituted per-dataset. The api_base is filled by launch.sh at
# run-time (mode_a or mode_b auto-discovery), so leave it empty here.
#
# Layout: Qwen writes to <output_root>/<name>/asr_plain_output/qwen/.

shar_dir:   "{shar_dir}"
output_dir: "{output_root}/{name}"

loader:
  num_workers:   16
  queue_size:    512
  min_duration:  0.5
  max_duration:  600

vllm_launcher:
  script: "vllm_qwen3_asr_launcher.sh"
  port:   8080

vllm_feeder:
  backend:    "transcription"
  slot_name:  "qwen"
  api_base:   ""
  api_key:    "EMPTY"
  api_model:  "Qwen/Qwen3-ASR-1.7B-${{USER}}"
  api_temperature: 0.0
  api_concurrency_per_replica: 32
  api_timeout: 240
  api_max_retries: 4
  log_every:         1000
  work_queue_size:   1024
  flush_every:       1000
  heartbeat_seconds: 5
  circuit_break_threshold: 50
