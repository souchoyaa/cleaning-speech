# asr_vllm — CV-FR config, Qwen2-Audio backend.
#
# Demonstrates the chat-completions backend: any vLLM-served model that
# accepts audio in the OpenAI ``messages`` format (Qwen2-Audio etc.).
# Same vLLM server flow as Voxtral — the only differences are the
# request body shape (chat vs audio API) and the model name.
#
# WARNING: ``Qwen3-1.7B`` is text-only. It cannot transcribe audio
# directly. To use a small Qwen for ASR you need either an audio-
# capable Qwen (e.g. ``Qwen/Qwen2-Audio-7B-Instruct``) or a separate
# audio-to-text frontend. This config picks the 7B audio model as the
# smallest working example.

shar_dir:   "/capstor/store/cscs/swissai/infra01/audio-datasets/SHAR/stage_2/commonvoice/fr_train"
output_dir: "/capstor/scratch/cscs/sgodey/data_selection_runs/quality/Result/quality_metrics/cv_fr_train"

loader:
  num_workers:   4
  queue_size:    512
  min_duration:  0.5
  max_duration:  30.0

vllm_feeder:
  backend:           "chat_completion"
  slot_name:         "qwen_audio"                       # subdir + JSONL slot name
  api_base:          ""
  api_key:           "EMPTY"
  api_model:         "Qwen/Qwen2-Audio-7B-Instruct"     # must match --served-model-name
  api_temperature:   0.0
  api_concurrency_per_replica: 128                      # × num_replicas
  api_timeout:       240
  api_max_retries:   4
  max_tokens:        512                                # cap output length
  prompt_template:   "Transcribe the {language} audio verbatim. Output only the transcript text."
  log_every:         1000
  work_queue_size:   256
  flush_every:       500
