# AUDIO pass on the BoW J>=0.7 COMBINED text clusters — TEST. Does BoW make a
# better candidate set for the audio pass than char-16-gram? text_dedup/
# clusters.parquet here = BoW clusters (written by bow_dedup.py); manifest/ is
# symlinked from the combined run (offsets already correct incl. MLS positional).
# Separate output dir → original combined result untouched.
# Run START_FROM=audio_fingerprint STOP_AFTER=audio_match.
shar_dirs:
  - /capstor/store/cscs/swissai/infra01/audio-datasets/SHAR/stage_2/mls/mls_english_train
  - /capstor/store/cscs/swissai/infra01/audio-datasets/SHAR/stage_2/peoples_speech_train_v2
  - /capstor/store/cscs/swissai/infra01/audio-datasets/SHAR/stage_2/commonvoice/en_train
dataset_overrides:
  /capstor/store/cscs/swissai/infra01/audio-datasets/SHAR/stage_2/mls/mls_english_train: mls_en
  /capstor/store/cscs/swissai/infra01/audio-datasets/SHAR/stage_2/peoples_speech_train_v2: peoples_speech_en
  /capstor/store/cscs/swissai/infra01/audio-datasets/SHAR/stage_2/commonvoice/en_train: cv_en
output_dir: /capstor/scratch/cscs/sgodey/data_selection_runs/dedup/combined_bow_perm/dedup_out

target_sample_rate: 16000
max_batch_duration: 1500.0
decode_num_workers: 8
prefetch_factor:    4
truncate_secs:      30.0

audio_fingerprint:
  mel_n_bins: 64
  mel_f_min: 200
  mel_f_max: 3000
  mel_frame_rate: 40
  hash_frame_rate: 12.5
  m_frames: 4
  M_frames: 20
  time_window: 9
  energy_factor: 1.0
  freq_top_k: 3
  keypoints_per_bin: 2
  peak_mode: global
  local_norm_time: 41
  silence_rel_floor: 0.02

audio_match:
  min_keypoints: 4
  match_min_abs: 4
  match_frac: 0.10
  min_relative_match: 0.10
  strong_match_frac: 0.85
  hist_tolerance: 1
  small_cluster_max: 200
  huge_cluster_max: 10000
  pre_filter_min_shared: 4
  workers: 16
  save_match_edges: true
