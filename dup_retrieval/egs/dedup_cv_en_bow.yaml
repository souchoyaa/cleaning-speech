# AUDIO dedup on the BoW text clusters — TEST. Verifies whether BoW's
# text-near-dups (J>=0.7) are ACTUALLY the same audio, or just same text /
# different audio (e.g. different speakers reading the same Common Voice prompt).
# text_dedup/clusters.parquet here is WRITTEN BY bow_dedup.py (not char-16-gram);
# manifest/ is symlinked from the cv_en run. Separate output dir → original
# CV result untouched. Run START_FROM=audio_fingerprint STOP_AFTER=audio_match.
shar_dirs:
  - /capstor/store/cscs/swissai/infra01/audio-datasets/SHAR/stage_2/commonvoice/en_train
dataset_overrides:
  /capstor/store/cscs/swissai/infra01/audio-datasets/SHAR/stage_2/commonvoice/en_train: cv_en
output_dir: /capstor/scratch/cscs/sgodey/data_selection_runs/dedup/cv_en_bow/dedup_out

target_sample_rate: 16000
max_batch_duration: 1500.0
num_buckets:        20
bucket_buffer_size: 10000
decode_num_workers: 8
prefetch_factor:    4
truncate_secs:      30.0

audio_fingerprint:
  mel_n_bins: 64
  mel_f_min: 200
  mel_f_max: 3000
  mel_frame_rate: 40
  hash_frame_rate: 12.5
  m_frames: 4
  M_frames: 20
  time_window: 9
  energy_factor: 1.0
  freq_top_k: 3
  keypoints_per_bin: 2
  peak_mode: global
  local_norm_time: 41
  silence_rel_floor: 0.02

audio_match:
  min_keypoints: 4
  match_min_abs: 4
  match_frac: 0.10
  min_relative_match: 0.10
  strong_match_frac: 0.85
  hist_tolerance: 1
  small_cluster_max: 200
  huge_cluster_max: 10000
  pre_filter_min_shared: 4
  workers: 16
  save_match_edges: true
